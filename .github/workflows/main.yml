name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  django-backend:
    name: Django backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Verify migrations are committed
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations and seed sample data
        run: |
          python manage.py migrate
          python manage.py seed_data

      - name: Run backend tests
        run: python manage.py test djangoapp -v 2

  dealership-service:
    name: Node dealership service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/database
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/database/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run service tests
        run: npm test

  frontend:
    name: React frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build production bundle
        run: npm run build

  sentiment-service:
    name: Flask sentiment tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/sentiment
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: server/sentiment/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Smoke-test sentiment endpoint
        run: |
          python -c "
          from app import app
          client = app.test_client()
          assert client.get('/health').status_code == 200
          payload = client.post('/analyze', json={'text': 'Fantastic services'}).get_json()
          assert payload['sentiment'] == 'positive', payload
          print('sentiment smoke test passed:', payload)
          "

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [django-backend, dealership-service, frontend, sentiment-service]
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config --quiet
        env:
          DJANGO_SECRET_KEY: ci-validation-only-not-a-real-secret

      - name: Build web image
        run: docker build -f server/Dockerfile -t cars-dealership-web ./server

      - name: Build dealership image
        run: docker build -f server/database/Dockerfile -t cars-dealership-db ./server

      - name: Build sentiment image
        run: docker build -f server/sentiment/Dockerfile -t cars-dealership-sentiment ./server
